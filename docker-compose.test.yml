# Test runner — isolated postgres in tmpfs (fast, no persistence needed)
# Usage:
#   docker compose -f docker-compose.test.yml run --rm test
#   docker compose -f docker-compose.test.yml run --rm test pytest users/tests/ -v

services:

  db-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dodoist_test
      POSTGRES_USER: dodoist
      POSTGRES_PASSWORD: dodoist
    tmpfs:
      - /var/lib/postgresql/data   # in-memory: fast startup, no cleanup needed
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dodoist -d dodoist_test"]
      interval: 3s
      timeout: 3s
      retries: 15

  test:
    build:
      context: .
      dockerfile: dodoist-backend/Dockerfile.test
    environment:
      DJANGO_SETTINGS_MODULE: dodoist.test_settings
      DJANGO_DEBUG: "true"
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: dodoist_test
      DB_USER: dodoist
      DB_PASSWORD: dodoist
      DB_HOST: db-test
      DB_PORT: "5432"
    depends_on:
      db-test:
        condition: service_healthy
