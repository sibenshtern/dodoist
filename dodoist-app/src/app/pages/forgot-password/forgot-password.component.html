<div class="auth-page">
  <div class="card">

    <div class="brand">
      <div class="brand-mark">D</div>
      <span class="brand-name">Dodoist</span>
    </div>

    @if (!submitted()) {
      <h1 class="card__title">Forgot password?</h1>
      <p class="card__sub">Enter your email and we'll send a reset link.</p>

      <form [formGroup]="form" (ngSubmit)="submit()" class="form">
        <div class="form-field">
          <label class="form-label">Email</label>
          <input
            class="form-input"
            type="email"
            formControlName="email"
            placeholder="you@example.com"
            autocomplete="email"
          />
        </div>
        @if (error()) { <p class="error-msg">{{ error() }}</p> }
        <button
          type="submit"
          class="btn-primary"
          [disabled]="form.invalid || isSubmitting()"
        >
          {{ isSubmitting() ? 'Sending…' : 'Send reset link' }}
        </button>
      </form>
    } @else {
      <div class="icon-wrap">✉️</div>
      <h1 class="card__title">Check your email</h1>
      <p class="card__sub">
        If an account with that email exists, a reset link has been sent.
        It expires in 1 hour.
      </p>
    }

    <a class="back-link" routerLink="/login">← Back to login</a>

  </div>
</div>
