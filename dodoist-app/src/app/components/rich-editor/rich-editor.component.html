@if (!readonly) {
  <div class="toolbar">
    <!-- Text style -->
    <button type="button" class="tb-btn" [class.tb-btn--active]="isActive('bold')"
      title="Bold (Ctrl+B)" (click)="editor.chain().focus().toggleBold().run()">
      <strong>B</strong>
    </button>
    <button type="button" class="tb-btn" [class.tb-btn--active]="isActive('italic')"
      title="Italic (Ctrl+I)" (click)="editor.chain().focus().toggleItalic().run()">
      <em>I</em>
    </button>
    <button type="button" class="tb-btn" [class.tb-btn--active]="isActive('strike')"
      title="Strikethrough" (click)="editor.chain().focus().toggleStrike().run()">
      <s>S</s>
    </button>
    <button type="button" class="tb-btn" [class.tb-btn--active]="isActive('code')"
      title="Inline code" (click)="editor.chain().focus().toggleCode().run()">
      <span class="mono">`</span>
    </button>

    <div class="tb-divider"></div>

    <!-- Headings -->
    <button type="button" class="tb-btn" [class.tb-btn--active]="isActive('heading', { level: 1 })"
      title="Heading 1" (click)="editor.chain().focus().toggleHeading({ level: 1 }).run()">H1</button>
    <button type="button" class="tb-btn" [class.tb-btn--active]="isActive('heading', { level: 2 })"
      title="Heading 2" (click)="editor.chain().focus().toggleHeading({ level: 2 }).run()">H2</button>
    <button type="button" class="tb-btn" [class.tb-btn--active]="isActive('heading', { level: 3 })"
      title="Heading 3" (click)="editor.chain().focus().toggleHeading({ level: 3 }).run()">H3</button>

    <div class="tb-divider"></div>

    <!-- Lists -->
    <button type="button" class="tb-btn" [class.tb-btn--active]="isActive('bulletList')"
      title="Bullet list" (click)="editor.chain().focus().toggleBulletList().run()">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
        <circle cx="2" cy="4" r="1.2" fill="currentColor"/>
        <line x1="5" y1="4" x2="13" y2="4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        <circle cx="2" cy="8" r="1.2" fill="currentColor"/>
        <line x1="5" y1="8" x2="13" y2="8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        <circle cx="2" cy="12" r="1.2" fill="currentColor"/>
        <line x1="5" y1="12" x2="13" y2="12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
    </button>
    <button type="button" class="tb-btn" [class.tb-btn--active]="isActive('orderedList')"
      title="Numbered list" (click)="editor.chain().focus().toggleOrderedList().run()">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
        <text x="0" y="5" font-size="5" fill="currentColor" font-family="monospace">1.</text>
        <line x1="5" y1="4" x2="13" y2="4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        <text x="0" y="9" font-size="5" fill="currentColor" font-family="monospace">2.</text>
        <line x1="5" y1="8" x2="13" y2="8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        <text x="0" y="13" font-size="5" fill="currentColor" font-family="monospace">3.</text>
        <line x1="5" y1="12" x2="13" y2="12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
    </button>
    <button type="button" class="tb-btn" [class.tb-btn--active]="isActive('blockquote')"
      title="Blockquote" (click)="editor.chain().focus().toggleBlockquote().run()">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
        <rect x="1" y="3" width="2" height="8" rx="1" fill="currentColor" opacity=".4"/>
        <rect x="5" y="3" width="2" height="8" rx="1" fill="currentColor" opacity=".4"/>
      </svg>
    </button>
    <button type="button" class="tb-btn" [class.tb-btn--active]="isActive('codeBlock')"
      title="Code block" (click)="editor.chain().focus().toggleCodeBlock().run()">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
        <polyline points="4,4 1,7 4,10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <polyline points="10,4 13,7 10,10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <line x1="8" y1="2" x2="6" y2="12" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
      </svg>
    </button>

    <div class="tb-divider"></div>

    <!-- History -->
    <button type="button" class="tb-btn" title="Undo (Ctrl+Z)"
      (click)="editor.chain().focus().undo().run()">
      <svg width="13" height="13" viewBox="0 0 13 13" fill="none">
        <path d="M2 5H7.5a3.5 3.5 0 0 1 0 7H4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        <polyline points="2,2 2,5 5,5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      </svg>
    </button>
    <button type="button" class="tb-btn" title="Redo (Ctrl+Shift+Z)"
      (click)="editor.chain().focus().redo().run()">
      <svg width="13" height="13" viewBox="0 0 13 13" fill="none">
        <path d="M11 5H5.5a3.5 3.5 0 0 0 0 7H9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        <polyline points="11,2 11,5 8,5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      </svg>
    </button>
  </div>
}

<div class="editor-wrap" [class.editor-wrap--readonly]="readonly">
  <tiptap-editor [editor]="editor"></tiptap-editor>
  @if (!readonly && isEmpty) {
    <div class="editor-placeholder">{{ placeholder }}</div>
  }
</div>
