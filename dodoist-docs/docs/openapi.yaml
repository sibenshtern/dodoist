openapi: 3.0.3
info:
  title: Dodoist API
  version: 1.0.0
  description: Task and project management API combining personal todos with Scrum/Kanban
    workflows.
paths:
  /api/activity/:
    get:
      operationId: activity_retrieve
      description: |-
        GET /api/activity/

        Returns the last N activity log entries across all projects
        the authenticated user is a member of.
      tags:
      - activity
      responses:
        '200':
          description: No response body
  /api/attachments/{id}/:
    delete:
      operationId: attachments_destroy
      description: DELETE /api/attachments/<pk>/
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - attachments
      responses:
        '204':
          description: No response body
  /api/attachments/{id}/download/:
    get:
      operationId: attachments_download_retrieve
      description: |-
        GET /api/attachments/<pk>/download/

        Streams the attachment file after verifying the caller has task-view access.
        This endpoint is the only authorized download path — direct media URLs are
        not exposed in the API (see AttachmentSerializer.get_download_url).
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - attachments
      responses:
        '200':
          description: No response body
  /api/auth/forgot-password:
    post:
      operationId: auth_forgot_password_create
      description: 'POST /api/auth/forgot-password   body: {email}'
      tags:
      - auth
      security:
      - {}
      responses:
        '200':
          description: No response body
  /api/auth/login:
    post:
      operationId: auth_login_create
      description: |-
        POST /api/auth/login

        Validates credentials. Returns a 15-minute access token in the body
        and sets a 7-day HttpOnly refresh token cookie.
      tags:
      - auth
      security:
      - {}
      responses:
        '200':
          description: No response body
  /api/auth/logout:
    post:
      operationId: auth_logout_create
      description: |-
        POST /api/auth/logout

        Invalidates the current session. Requires authentication.
        Clears the refresh token cookie.
      tags:
      - auth
      responses:
        '200':
          description: No response body
  /api/auth/refresh:
    post:
      operationId: auth_refresh_create
      description: |-
        POST /api/auth/refresh

        Exchanges the HttpOnly refresh token cookie for new access + refresh tokens
        (full rotation). If a previously-rotated refresh token is replayed, the
        session is revoked (refresh token reuse detection).
      tags:
      - auth
      security:
      - {}
      responses:
        '200':
          description: No response body
  /api/auth/register:
    post:
      operationId: auth_register_create
      description: |-
        POST /api/auth/register

        Creates a new user account. Returns a 15-minute access token in the body
        and sets a 7-day HttpOnly refresh token cookie.
      tags:
      - auth
      security:
      - {}
      responses:
        '200':
          description: No response body
  /api/auth/resend-verification:
    post:
      operationId: auth_resend_verification_create
      description: POST /api/auth/resend-verification   (authenticated)
      tags:
      - auth
      responses:
        '200':
          description: No response body
  /api/auth/reset-password:
    post:
      operationId: auth_reset_password_create
      description: 'POST /api/auth/reset-password   body: {token, new_password}'
      tags:
      - auth
      security:
      - {}
      responses:
        '200':
          description: No response body
  /api/auth/sse-token/:
    post:
      operationId: auth_sse_token_create
      description: |-
        POST /api/auth/sse-token/
        Returns a 60-second single-use token the client passes as ?token= to /api/events/.
      tags:
      - auth
      responses:
        '200':
          description: No response body
  /api/auth/verify-email:
    post:
      operationId: auth_verify_email_create
      description: 'POST /api/auth/verify-email   header: X-Verification-Token'
      tags:
      - auth
      security:
      - {}
      responses:
        '200':
          description: No response body
  /api/boards/{board_pk}/columns/{id}/:
    patch:
      operationId: boards_columns_partial_update
      description: |-
        PATCH  /api/boards/<board_pk>/columns/<pk>/  — update column
        DELETE /api/boards/<board_pk>/columns/<pk>/  — delete column
      parameters:
      - in: path
        name: board_pk
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - boards
      responses:
        '200':
          description: No response body
    delete:
      operationId: boards_columns_destroy
      description: |-
        PATCH  /api/boards/<board_pk>/columns/<pk>/  — update column
        DELETE /api/boards/<board_pk>/columns/<pk>/  — delete column
      parameters:
      - in: path
        name: board_pk
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - boards
      responses:
        '204':
          description: No response body
  /api/boards/{id}/:
    get:
      operationId: boards_retrieve
      description: |-
        GET    /api/boards/<pk>/  — get board
        PATCH  /api/boards/<pk>/  — update board (PM/PO/SA)
        DELETE /api/boards/<pk>/  — delete board (PM/PO/SA)
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - boards
      responses:
        '200':
          description: No response body
    patch:
      operationId: boards_partial_update
      description: |-
        GET    /api/boards/<pk>/  — get board
        PATCH  /api/boards/<pk>/  — update board (PM/PO/SA)
        DELETE /api/boards/<pk>/  — delete board (PM/PO/SA)
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - boards
      responses:
        '200':
          description: No response body
    delete:
      operationId: boards_destroy
      description: |-
        GET    /api/boards/<pk>/  — get board
        PATCH  /api/boards/<pk>/  — update board (PM/PO/SA)
        DELETE /api/boards/<pk>/  — delete board (PM/PO/SA)
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - boards
      responses:
        '204':
          description: No response body
  /api/boards/{id}/columns/:
    get:
      operationId: boards_columns_retrieve
      description: |-
        GET  /api/boards/<pk>/columns/  — list columns
        POST /api/boards/<pk>/columns/  — create column (PM/PO/SA)
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - boards
      responses:
        '200':
          description: No response body
    post:
      operationId: boards_columns_create
      description: |-
        GET  /api/boards/<pk>/columns/  — list columns
        POST /api/boards/<pk>/columns/  — create column (PM/PO/SA)
